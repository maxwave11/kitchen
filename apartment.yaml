# APARTMENT (Maxim) - 2-room flat, 56.48 m² total / 55.29 m² without the loggia
# Source: developer's plan docs/apartment-plan.png (areas on the plan are official).

total_area_m2: 56.48
living_area_m2: 23.20      # both bedrooms

# -----------------------------------------------------------
# LAYOUT
# -----------------------------------------------------------
# The kitchen-living room is the only room modelled in detail (rooms/kitchen-living.yaml).
# Every other room is CONTEXT for its 3D viewer: walls, floors and the big furniture, drawn
# around the kitchen and hidden by default (the eye icons in the viewer's tree show them).
#
# All coordinates below are in the KITCHEN's frame: origin = kitchen corner A, X = "east"
# (along kitchen wall A-B), Y = "north" (along B-C), cm. On the plan image that is:
# X = up, Y = left. The plan is not exactly to scale: it was fitted so the kitchen matches
# Maxim's measurements (536.2 x 306.1 cm), the rest is read off the plan, about ±10-15 cm.
# Plan areas vs the fitted outlines: corridor 9.66 / 9.91, bedroom 13.15 / 12.42,
# bedroom 10.05 / 10.70, bathroom 4.01 / 4.66 (with the riser box), WC 1.45 / 1.29.
#
#   X ↑ (east)
#        +-----------------------------+
#        |  loggia 3.98                |
#        +----------------+------------+
#        |  bedroom 13.15              |
#        |                             |
#        +------+---door--+-----+------+
#        | WC   |  corridor 9.66 |hall unit
#        +------+                entrance door →
#        |vent  |wardrobe+------------+--------+
#        +------+--door--+  corridor  | bathroom
#        |                | branch     | 4.01
#        |  KITCHEN-LIVING +--door-----+--------+
#        |  16.97          |  bedroom 10.05      |
#        |  (C-D left,     |                     |
#        |   A-B right)    |                     |
#        +-----------------+---------------------+   ← Y (north) to the left
#        D   window      A      window
#
#  adjacencies (kitchen wall ids):
#    kitchen B-C (door-1)  -> corridor
#    kitchen A-B           -> corridor branch (X 350..536) and bedroom 10.05 (X 0..337)

# -----------------------------------------------------------
# 3D CONTEXT for tools/room3d/build_room_3d.py (frame: kitchen-living)
#   floor:  polygon [[x, y], ...]; floor_color: "#rrggbb" (tiles), none = laminate like the kitchen
#   walls:  [x0, y0, x1, y1]          full-height wall box (any two opposite corners)
#           [x0, y0, x1, y1, z0, z1]  partial box: lintel over a door, wall under a window
#   glass:  [x0, y0, x1, y1, z0, z1]  window / balcony door pane
#   objects: furniture, doors, boxes - the SAME format as `objects:` in rooms/kitchen-living.yaml, every room alike.
#           An object stands against a wall of its room: the outline of `floor` gives the walls A-B, B-C, ...
#           (corner A = first point of `floor`; the corners are listed in a comment above each `objects:`).
#             wall      wall id, e.g. D-A
#             position  cm along that wall, from its first corner (D) to the object's near edge
#             gap       cm from the wall plane into the room (default 0; < 0 = behind / inside the wall, e.g. a door leaf)
#             width     cm ALONG the wall        depth  cm AWAY from the wall        height  cm
#             elevation cm above the floor (default 0), color "#rrggbb", label, group (optional tree folder)
#           Size is ALWAYS width x depth x height - never "along X / along Y". Same optional fields as the kitchen's
#           objects: top, type: table | portal, model, cutout, kitchen (see tools/room3d/README.md).
#           Inheritance: `parent:` (a `type: group` object) gives its height / depth / elevation / gap / top to children that
#           do not set them; any number may be a link "=other-id.height + 5" (README, "Контейнеры, наследование и ссылки").
#           The old x / y / sx / sy / against / items: are rejected by the build.
# -----------------------------------------------------------
frame: kitchen-living
height: 270
rooms:
  - id: corridor
    name: "Коридор"
    area_m2: 9.66
    floor: [[350, -12], [350, -134.5], [623, -134.5], [623, -37], [809, -37], [809, 181.5],
            [548.2, 181.5], [548.2, -12]]
    walls:
      - [741.5, -37, 809, -60.5]              # east wall, next to the entrance door
      - [623, -37, 649, -60.5]                # stub between bathroom and entrance door
      - [649, -37, 741.5, -60.5, 210, 270]    # lintel over the entrance door
      - [548.2, 296, 801, 334]                # outer wall behind the ventilation and the WC
    # corners of `floor` = A, B, C... in order; wall A-B runs from corner A to B; gap < 0 = behind the wall plane
    # A=(350, -12)  B=(350, -134.5)  C=(623, -134.5)  D=(623, -37)  E=(809, -37)  F=(809, 181.5)  G=(548.2, 181.5)  H=(548.2, -12)
    objects:
