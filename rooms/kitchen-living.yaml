# Rectangle 536.2 x 306.1 cm. Compass orientation is NOT known yet:
# "south" here just means wall A-B (the long wall with corner A at its left end
# when viewed from inside the room). Re-label once windows/doors are known.
ascii: |
  #        D___________________________C
  #        |                           |
  #        |                           |   306.1
  #        |                           |
  #        A___________________________B
  #                   536.2

walls:
  - id: A-B
    direction: east
    length: 536.2
  - id: B-C
    direction: north
    length: 306.1
  - id: C-D
    direction: west
    length: 536.2
  - id: D-A
    direction: south
    length: 306.1

