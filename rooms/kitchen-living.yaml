heating: []
plumbing: []     # TODO: water supply / drain riser, ventilation, gas

# 3D-only objects for the viewer (tools/room3d), the SAME format as `objects:` of every room in apartment.yaml.
# Every object STANDS AGAINST A WALL and stays flush with it:
#   wall      wall id; the object's back is on that wall's inner surface (plus `gap`)
#   position  cm from the wall's first corner (B for B-C) to the object's near edge, along the wall
#   width     cm along the wall (the front side)        depth  cm from the wall into the room
#   height    cm                                         elevation  cm above the floor (default 0)
#   gap       cm between wall and back of the object (default 0; < 0 = sunk into the wall)
#   top       optional countertop thickness, cm (slab on top, 2 cm front overhang)
#   kitchen   true = cabinet in the kitchen palette (front panel + carcass + worktop); panel = plain carcass board
#   facade_side  start | end = front panel on the side facing the wall's first / second corner
#   model     .glb fitted into the object's box;  cutout: {in, width, depth} = hole in another object
#   type: portal  П-shaped arch of `rails` frames (rail_width along the depth, rail_thickness profile)
#
# INHERITANCE (tools/room3d/README.md): `parent:` points at a `type: group` / `type: kitchen` object, a container with no
# geometry. What a child does not set (height, depth, elevation, gap, top) it takes from its parent. Any number can also be
# a link, "=expression": a bare name is this object's own property, `id.name` is another object's ("=lower.height + lower.top").
#   kitchen  one object: the palette (facade / carcass / worktop) of every `kitchen:` cabinet + two parts
#     lower  height 90 / depth 60 / worktop 4 of every lower cabinet (change it once: all follow)
#     upper  top of the upper cabinets (params.level); a cabinet with only an `elevation` reaches up to it
#   portal   its height is the single source: the opening door-1, the panel beside it, the cabinet over it follow
# Saved from the 3D viewer (Maxim, 2026-11-07). Sink: Hansgrohe C51-F450-01, fridge: AEG bottom freezer,
# both from Maxim's .3ds files (assets/models/). Sink cut-out is an estimate from the model - take the
# real one from the Hansgrohe installation template.
objects:
  - id: kitchen
    label: "Кухня"
    type: kitchen
    facade: "#d49b16"
    carcass: "#654a29"
    worktop: "#6b6259"
  - id: lower
    label: "Нижняя часть"
    type: group
    parent: kitchen
    height: 90
    depth: 60
    top: 4
  - id: upper
    label: "Верхняя часть"
    type: group
    parent: kitchen
    depth: 40
    height: "=upper.level - elevation"
    params:
      level: {value: 260, label: "Верх шкафов от пола"}
  - id: e-base
    label: "Нижние шкафы (B-C)"
    parent: lower
    wall: B-C
    position: 144
    width: 162
    color: "#d8cfc4"
    kitchen: true
  - id: sink
    label: "Мойка Hansgrohe C51-F450-01"
    parent: kitchen
    wall: B-C
    position: 173.1
    gap: 5
    elevation: "=lower.height - 24.5"   # the basin hangs 24.5 cm under the worktop line
    width: 56
    depth: 52
    height: 62.5
    color: "#303030"
    model: assets/models/hansgrohe-c51-f450-01.glb
    cutout: {in: e-base, width: 53, depth: 49}
  - id: e-upper
    label: "Верхний шкаф (B-C)"
    parent: upper
    wall: B-C
    position: 144
    elevation: 160
    width: 162
    color: "#e9e6df"
    kitchen: true
  - id: fridge-panel
    label: "Панель ДСП между порталом и холодильником"
    parent: kitchen
    wall: B-C
    position: "=portal.position + portal.width"
    width: 1.6
    depth: 64
    height: "=portal.height"
    color: "#d8cfc4"
    kitchen: panel
  - id: fridge
    label: "Холодильник AEG"
    parent: kitchen
    wall: B-C
    position: 82
    elevation: 2
    width: 59.5
    depth: 67.2
    height: 184.5
    color: "#c9ccce"
    model: assets/models/aeg-fridge-freezer-bottom-silver.glb
  - id: fridge-top
    label: "Шкаф над холодильником"
    parent: upper
    wall: B-C
    position: 81
    elevation: 190
    width: 62
    depth: 64
    color: "#e9e6df"
    kitchen: true
  - id: portal-shelf
    label: "Полка над порталом"
    parent: upper
    wall: B-C
    position: "=portal.position"
    elevation: "=portal.height"
    width: "=portal.width + 1"
    depth: 64
    color: "#b08b5e"
    kitchen: true
  - id: portal
    label: "Портал (арка из реек)"
    type: portal
    wall: B-C
    position: "=door-1.position"
    width: "=door-1.width"
    height: 210                        # the one number: door-1, the arch, the panel and the shelf over it follow
    gap: -12
    depth: 76
    rails: 8
    rail_width: 5
    rail_thickness: 1
    color: "#b08b5e"
  - id: n-base
    label: "Нижние шкафы (C-D)"
    parent: lower
    wall: C-D
    position: 60
    width: 180
    color: "#d8cfc4"
    kitchen: true
  - id: hob
    label: "Варочная панель"
    parent: kitchen
    wall: C-D
    position: 110
    gap: 4.1
    elevation: "=lower.height + lower.top"      # lies on the worktop
    width: 60
    depth: 52
    height: 1
    color: "#1d1d1d"
  # Bar table instead of the peninsula cabinet (Maxim, 2026-11-08): no carcass, four legs, movable.
  # Saved from the 3D viewer 2026-11-08: 70 x 150, top at 78 (no longer flush with the worktop), 62 cm from the C-D wall
  # (worktop front 60 + 2 cm overhang), 170 cm from corner C.
  - id: bar-set
    label: "Барный стол"
    type: group
  - id: bar
    label: "Стол"
    parent: bar-set
    type: table
    wall: C-D
    position: 170
    gap: 62
    width: 70
    depth: 150
    height: 78
    top: 4
    leg: 5
    color: "#1e1e1e"
    kitchen: true
  # COR Jalis 522 counter stools (seat ~65 cm), from Maxim's Jalis.zip; standing on the living-room side,
  # facing the table (east), seat front 10 cm under the table edge.
  - id: stool-1
    label: "Полубарный стул COR Jalis 522 (1)"
    parent: bar-set
    wall: D-A
    position: 77
    gap: 272.5
    width: 45.2
    depth: 49
    height: 89.9
    color: "#6e655c"
    model: assets/models/cor-jalis-522-counter-stool.glb
  - id: stool-2
    label: "Полубарный стул COR Jalis 522 (2)"
    parent: bar-set
    wall: D-A
    position: 152
    gap: 274.5
    width: 45.2
    depth: 49
    height: 89.9
    color: "#6e655c"
    model: assets/models/cor-jalis-522-counter-stool.glb

  # Sofa couch_015 from Maxim's sources/couch_015.max (2026-11-08): back to the long wall A-B, faces north.
  - id: sofa
    label: "Диван couch_015"
    wall: A-B
    position: 0
    width: 235.6
    depth: 83.5
    height: 50.4
    color: "#8a8f98"
    model: assets/models/couch-015.glb

zones: []
focal_point:
