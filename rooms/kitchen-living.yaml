# KITCHEN-LIVING ROOM (Maxim)

id: kitchen-living
name: "Кухня-гостиная"
area_m2: 16.97   # developer plan (docs/apartment-plan.png)

# Rectangle 536.2 x 306.1 cm. Compass orientation is NOT known yet:
# "south" here just means wall A-B (the long wall with corner A at its left end
# when viewed from inside the room). Re-label once windows/doors are known.
ascii: |
  #        D___________________________C
  #        |                           |
  #        |                           |   306.1
  #        |                           |
  #        A___________________________B
  #                   536.2

walls:
  - id: A-B
    direction: east
    length: 536.2
  - id: B-C
    direction: north
    length: 306.1
  - id: C-D
    direction: west
    length: 536.2
  - id: D-A
    direction: south
    length: 306.1

validation:
  trace_closes: true
  calculated_area: 16.41    # 536.2 x 306.1
  area_difference_pct: -3.3
  area_matches: true

ceiling_height: 270
wall_thickness: 12

design:
  goal: ""
  objectives: []

built_ins: []
windows:
  # Wall confirmed by Maxim (opposite the doorway). Position/size still unmeasured.
  - id: window
    wall: D-A
    position: 78        # TODO: measure (cm from corner D to window edge)
    width: 150          # TODO
    sill_height: 85     # TODO
    height: 150         # TODO
    type: casement
openings:
  # Wall confirmed by Maxim; position/width set in the 3D viewer (2026-11-07).
  - id: door-1
    wall: B-C
    position: 0         # cm from corner B to opening edge
    width: 80
    height: 210         # TODO
    to: ""              # TODO: where it leads
    has_door: true      # TODO
    swing: in           # TODO
  # TODO: second doorway — wall/position/size unknown
outlets: []
heating: []
plumbing: []     # TODO: water supply / drain riser, ventilation, gas

# Kitchen palette (3D viewer): fronts of every `kitchen: true` cabinet, their carcass and all worktops.
kitchen_colors:
  facade: "#d49b16"
  carcass: "#654a29"
  worktop: "#6b6259"

# 3D-only objects for the viewer (tools/room3d). Every object STANDS AGAINST A WALL and stays flush with it:
#   wall      wall id; the object's back is on that wall's inner surface (plus `gap`)
#   position  cm from the wall's first corner (B for B-C) to the object's near edge, along the wall
#   width     cm along the wall (the front side)        depth  cm from the wall into the room
#   height    cm                                         elevation  cm above the floor (default 0)
#   gap       cm between wall and back of the object (default 0; < 0 = sunk into the wall, down to -20)
#   top       optional countertop thickness, cm (slab on top, 2 cm front overhang)
#   kitchen   true = cabinet in the kitchen palette (front panel + carcass + worktop); panel = plain carcass board
#   facade_side  start | end = front panel on the side facing the wall's first / second corner
#   model     .glb fitted into the object's box;  cutout: {in, width, depth} = hole in another object
#   type: portal  П-shaped arch of `rails` frames (rail_width along the depth, rail_thickness profile)
# Saved from the 3D viewer (Maxim, 2026-11-07). Sink: Hansgrohe C51-F450-01, fridge: AEG bottom freezer,
# both from Maxim's .3ds files (assets/models/). Sink cut-out is an estimate from the model - take the
# real one from the Hansgrohe installation template.
objects:
  - id: e-base
    label: "Нижние шкафы (B-C)"
    group: "Стена B-C"
    wall: B-C
    position: 144
    width: 162
    depth: 60
    height: 90
    top: 4
    color: "#d8cfc4"
    kitchen: true
  - id: sink
    label: "Мойка Hansgrohe C51-F450-01"
    group: "Стена B-C"
    wall: B-C
    position: 173.1
    gap: 5
    elevation: 65.5
    width: 56
    depth: 52
    height: 62.5
    color: "#303030"
    model: assets/models/hansgrohe-c51-f450-01.glb
    cutout: {in: e-base, width: 53, depth: 49}
  - id: e-upper
    label: "Верхний шкаф (B-C)"
    group: "Стена B-C"
    wall: B-C
    position: 144
    elevation: 160
    width: 162
    depth: 40
    height: 99.5
    color: "#e9e6df"
    kitchen: true
  - id: fridge-panel
    label: "Панель ДСП между порталом и холодильником"
    group: "Стена B-C"
    wall: B-C
    position: 80
    width: 1.6
    depth: 64
    height: 210
    color: "#d8cfc4"
    kitchen: panel
  - id: fridge
    label: "Холодильник AEG"
    group: "Стена B-C"
    wall: B-C
    position: 82
    elevation: 2
    width: 59.5
    depth: 67.2
    height: 184.5
    color: "#c9ccce"
    model: assets/models/aeg-fridge-freezer-bottom-silver.glb
  - id: fridge-top
    label: "Шкаф над холодильником"
    group: "Стена B-C"
    wall: B-C
    position: 81
    elevation: 190
    width: 62
    depth: 64
    height: 70
    color: "#e9e6df"
    kitchen: true
  - id: portal-shelf
    label: "Полка над порталом"
    group: "Портал"
    wall: B-C
    position: 0
    elevation: 210
    width: 81
    depth: 64
    height: 50
    color: "#b08b5e"
    kitchen: true
  - id: portal
    label: "Портал (арка из реек)"
    group: "Портал"
    type: portal
    wall: B-C
    position: 0
    gap: -12
    width: 80
    depth: 76
    height: 210
    rails: 8
    rail_width: 5
    rail_thickness: 1
    color: "#b08b5e"
  - id: n-base
    label: "Нижние шкафы (C-D)"
    group: "Стена C-D"
    wall: C-D
    position: 60
    width: 180
    depth: 60
    height: 90
    top: 4
    color: "#d8cfc4"
    kitchen: true
  - id: hob
    label: "Варочная панель"
    group: "Стена C-D"
    wall: C-D
    position: 110
    gap: 4.1
    elevation: 94
    width: 60
    depth: 52
    height: 1
    color: "#1d1d1d"
  # Bar table instead of the peninsula cabinet (Maxim, 2026-11-08): no carcass, four legs, movable.
  # Top flush with the worktop (94) and pushed against the C-D worktop front (60 + 2 cm overhang).
  - id: bar
    label: "Барный стол"
